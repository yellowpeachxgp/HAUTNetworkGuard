name: Build and Release
run-name: ${{ github.workflow }} · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-openwrt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.3

      - name: Validate OpenWrt Lua Scripts
        run: |
          find OpenWrt/files/usr/lib/haut-network-guard -name '*.lua' -print -exec luac5.3 -p {} \;
          find OpenWrt/files/usr/lib/haut-network-guard -name '*.lua' -print -exec luac5.1 -p {} \;

      - name: Validate Protocol And Docs Contracts
        run: |
          python3 tests/test_protocol_contract.py
          python3 tests/test_docs_contract.py
          python3 tests/test_acceptance_matrix.py
          python3 tests/test_version_contract.py
          python3 tests/test_startup_contract.py
          python3 tests/test_openwrt_diagnose.py
          python3 tests/test_release_contract.py
          python3 tests/test_logging_contract.py
          python3 tests/test_session_policy.py

      - name: Validate OpenWrt Modules
        run: |
          LUA_PATH="OpenWrt/files/usr/lib/haut-network-guard/?.lua;;" lua5.3 tests/test_openwrt_modules.lua
          lua5.1 tests/test_openwrt_modules.lua
          lua5.1 tests/test_openwrt_runtime.lua
          lua5.3 tests/test_openwrt_runtime.lua
          lua5.1 tests/test_openwrt_session.lua
          lua5.3 tests/test_openwrt_session.lua
          lua5.1 tests/test_openwrt_log.lua
          lua5.3 tests/test_openwrt_log.lua
          HAUT_TEST_LUA=lua5.1 python3 tests/test_openwrt_installation.py
          HAUT_TEST_LUA=lua5.3 python3 tests/test_openwrt_installation.py

      - name: Validate OpenWrt Shell Scripts
        run: |
          sh -n OpenWrt/install.sh
          sh -n OpenWrt/install-online.sh
          sh -n OpenWrt/uninstall.sh
          sh -n OpenWrt/uninstall-online.sh
          sh -n OpenWrt/upgrade-online.sh
          sh -n OpenWrt/files/etc/init.d/haut-network-guard

  build-windows-qt:
    # Qt 6.6 的当前构建链使用 VS 2022，固定与生成器配套的镜像。
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.6.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtnetworkauth'

      - name: Configure CMake
        run: cmake -B build -S Windows -G "Visual Studio 17 2022" -A x64
        
      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Windows Smoke Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Deploy Qt Runtime
        run: |
          mkdir HAUTNetworkGuard-Windows
          copy build\Release\HAUTNetworkGuard.exe HAUTNetworkGuard-Windows\
          # QNetworkInformation 的 networklistmanager 后端通过插件动态加载，必须包含软插件。
          windeployqt HAUTNetworkGuard-Windows\HAUTNetworkGuard.exe --release --include-soft-plugins --no-translations --no-opengl-sw

      - name: Create Installer ZIP
        run: |
          if (Test-Path HAUTNetworkGuard-Windows.zip) {
            Remove-Item HAUTNetworkGuard-Windows.zip -Force
          }
          Compress-Archive -Path HAUTNetworkGuard-Windows -DestinationPath HAUTNetworkGuard-Windows.zip

      - name: Validate Installer ZIP
        shell: pwsh
        run: |
          $extract = Join-Path $PWD "zip-validation"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path HAUTNetworkGuard-Windows.zip -DestinationPath $extract
          $root = Join-Path $extract "HAUTNetworkGuard-Windows"
          if (-not (Test-Path (Join-Path $root "HAUTNetworkGuard.exe"))) { throw "ZIP 缺少主程序" }
          foreach ($dll in @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Network.dll", "Qt6Widgets.dll", "platforms/qwindows.dll")) {
            if (-not (Test-Path (Join-Path $root $dll))) { throw "ZIP 缺少运行库: $dll" }
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: HAUTNetworkGuard-Windows.zip
          if-no-files-found: error
          retention-days: 7

  build-macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build macOS App
        run: |
          cd macOS
          chmod +x build.sh create-dmg.sh tests/run_smoke_tests.sh tests/run_ui_smoke_tests.sh
          python3 ../tests/test_macos_uninstall.py
          python3 ../tests/test_session_policy.py
          ./tests/run_smoke_tests.sh
          ./tests/run_ui_smoke_tests.sh
          ./build.sh
          ./create-dmg.sh

      - name: Verify Code Signature
        run: |
          codesign --verify --verbose macOS/build/HAUTNetworkGuard.app
          echo "代码签名验证通过"

      - name: Validate DMG Artifact
        run: |
          set -euo pipefail
          hdiutil verify macOS/build/HAUTNetworkGuard.dmg
          mount_point="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            rmdir "$mount_point" || true
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" macOS/build/HAUTNetworkGuard.dmg >/dev/null
          test -x "$mount_point/HAUTNetworkGuard.app/Contents/MacOS/HAUTNetworkGuard"
          codesign --verify --deep --strict "$mount_point/HAUTNetworkGuard.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: macOS/build/HAUTNetworkGuard.dmg
          if-no-files-found: error
          retention-days: 7

  release-dry-run:
    # PR、main、tag 和手动运行都验证发布资产事务；该 job 本身不创建或修改 GitHub Release。
    needs: [validate-openwrt, build-windows-qt, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: ./

      - name: Download macOS Artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-build
          path: ./

      - name: Generate And Validate Release Bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION_FILE="$(cat VERSION)"
          test -s HAUTNetworkGuard-Windows.zip
          test -s HAUTNetworkGuard.dmg
          unzip -t HAUTNetworkGuard-Windows.zip >/dev/null
          sha256sum HAUTNetworkGuard-Windows.zip HAUTNetworkGuard.dmg > SHA256SUMS
          sha256sum -c SHA256SUMS
          find OpenWrt -type f \( -name '*.sh' -o -path 'OpenWrt/files/*' \) -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > OpenWrt-SHA256SUMS
          test -s OpenWrt-SHA256SUMS
          for path in \
            install.sh install-online.sh upgrade-online.sh uninstall.sh uninstall-online.sh \
            files/etc/init.d/haut-network-guard files/etc/config/haut-network-guard \
            files/usr/lib/haut-network-guard/version.lua \
            files/usr/lib/haut-network-guard/crypto.lua \
            files/usr/lib/haut-network-guard/api.lua \
            files/usr/lib/haut-network-guard/log.lua \
            files/usr/lib/haut-network-guard/protocol.lua \
            files/usr/lib/haut-network-guard/session.lua \
            files/usr/lib/haut-network-guard/main.lua; do
            grep -Fq "OpenWrt/$path" OpenWrt-SHA256SUMS
          done
          grep -Fq "return \"$VERSION_FILE\"" OpenWrt/files/usr/lib/haut-network-guard/version.lua
          echo "发布资产 dry-run 通过: v$VERSION_FILE"

  release:
    needs: [validate-openwrt, build-windows-qt, build-macos, release-dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: ./

      - name: Download macOS Artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-build
          path: ./

      - name: Get Version
        id: get_version
        run: |
          VERSION_FILE="$(cat VERSION)"
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          test "$VERSION_FILE" = "$TAG_VERSION"
          echo "VERSION=v$VERSION_FILE" >> $GITHUB_OUTPUT

      - name: Generate Asset Checksums
        run: |
          sha256sum HAUTNetworkGuard-Windows.zip HAUTNetworkGuard.dmg > SHA256SUMS
          find OpenWrt -type f \( -name '*.sh' -o -path 'OpenWrt/files/*' \) -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > OpenWrt-SHA256SUMS

      - name: Validate Release Assets
        run: |
          set -euo pipefail
          test -s HAUTNetworkGuard-Windows.zip
          test -s HAUTNetworkGuard.dmg
          sha256sum -c SHA256SUMS
          for path in \
            install.sh install-online.sh upgrade-online.sh uninstall.sh uninstall-online.sh \
            files/etc/init.d/haut-network-guard files/etc/config/haut-network-guard \
            files/usr/lib/haut-network-guard/version.lua \
            files/usr/lib/haut-network-guard/crypto.lua \
            files/usr/lib/haut-network-guard/api.lua \
            files/usr/lib/haut-network-guard/log.lua \
            files/usr/lib/haut-network-guard/protocol.lua \
            files/usr/lib/haut-network-guard/session.lua \
            files/usr/lib/haut-network-guard/main.lua; do
            grep -Fq "OpenWrt/$path" OpenWrt-SHA256SUMS
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## HAUTNetworkGuard ${{ steps.get_version.outputs.VERSION }}
            
            河南工业大学校园网自动登录工具
            
            ### 📦 下载
            
            | 平台 | 文件 | 说明 |
            |------|------|------|
            | **Windows** | `HAUTNetworkGuard-Windows.zip` | 解压后运行 `HAUTNetworkGuard.exe` |
            | **macOS** | `HAUTNetworkGuard.dmg` | 双击安装到应用程序 |
            | **OpenWrt** | 一键安装 | `wget -qO- https://raw.githubusercontent.com/yellowpeachxgp/HAUTNetworkGuard/${{ steps.get_version.outputs.VERSION }}/OpenWrt/install-online.sh \| sh -s -- ${{ steps.get_version.outputs.VERSION }}` |

            ### ⚠️ macOS 用户注意

            首次打开可能提示"无法验证开发者"，解决方法：

            **方法一**: 右键点击应用 → 选择"打开" → 在弹窗中点击"打开"

            **方法二**: 在终端执行：
            ```
            xattr -cr /Applications/HAUTNetworkGuard.app
            ```
            
            ### 🔄 更新内容
            
            详见 [README.md 版本历史](https://github.com/yellowpeachxgp/HAUTNetworkGuard#版本历史)
            
            ---
            
            **首次使用**: 运行后输入学号和密码，勾选"记住密码"和"开机自启动"即可。
          files: |
            HAUTNetworkGuard-Windows.zip
            HAUTNetworkGuard.dmg
            SHA256SUMS
            OpenWrt-SHA256SUMS
